name: Validate quiz library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
  snippets:
    name: Independent snippet QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Install checksum-verified kubeconform v0.7.0
        run: |
          mkdir -p "$RUNNER_TEMP/snippet-tools"
          cd "$RUNNER_TEMP/snippet-tools"
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
          sha256sum --check --ignore-missing CHECKSUMS
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP/snippet-tools" >> "$GITHUB_PATH"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Ansible syntax and behavior validator
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-qa"
          "$RUNNER_TEMP/ansible-qa/bin/python" -m pip install ansible-core==2.22.0
          echo "$RUNNER_TEMP/ansible-qa/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run snippets:qa
