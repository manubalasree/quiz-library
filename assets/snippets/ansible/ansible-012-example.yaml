---
- name: Handlers reference
  hosts: all
  gather_facts: false
  vars:
    http_port: 8080
  tasks:
    - ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /tmp/practice-app.conf
        mode: "0640"
      notify: Restart app
  handlers:
    - name: Restart app
      ansible.builtin.service:
        name: app
        state: restarted
