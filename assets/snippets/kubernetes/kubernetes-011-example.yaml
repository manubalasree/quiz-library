apiVersion: v1
kind: Pod
metadata: {name: startup-demo}
spec:
  containers:
    - name: web
      image: nginx:1.28
      startupProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 5
