apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-agent-demo}
spec:
  selector:
    matchLabels: {app: node-agent-demo}
  template:
    metadata:
      labels: {app: node-agent-demo}
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          command: [sh, -c, 'while true; do echo heartbeat; sleep 60; done']
