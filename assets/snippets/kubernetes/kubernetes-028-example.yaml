apiVersion: v1
kind: ConfigMap
metadata: {name: app-settings}
data: {MODE: practice}
---
apiVersion: v1
kind: Pod
metadata: {name: env-demo}
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: [sh, -c, 'echo "$MODE"; sleep 3600']
      envFrom:
        - configMapRef: {name: app-settings}
