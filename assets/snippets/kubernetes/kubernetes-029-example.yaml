apiVersion: v1
kind: ConfigMap
metadata: {name: app-settings}
data: {app.conf: 'mode=practice'}
---
apiVersion: v1
kind: Pod
metadata: {name: subpath-demo}
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: [sh, -c, 'cat /etc/app.conf; sleep 3600']
      volumeMounts:
        - name: config
          mountPath: /etc/app.conf
          subPath: app.conf
  volumes:
    - name: config
      configMap: {name: app-settings}
