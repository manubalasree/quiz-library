apiVersion: apps/v1
kind: Deployment
metadata: {name: tolerant-app, namespace: virtmicro-lab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tolerant-app}
  template:
    metadata:
      labels: {app: tolerant-app}
    spec:
      tolerations:
        - key: virtmicro-lab/dedicated
          operator: Equal
          value: practice
          effect: NoSchedule
      containers:
        - name: app
          image: nginx:1.28
