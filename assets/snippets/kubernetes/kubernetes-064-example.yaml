apiVersion: apps/v1
kind: Deployment
metadata: {name: rollout-strategy-demo, namespace: virtmicro-lab}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: rollout-strategy-demo}
  template:
    metadata:
      labels: {app: rollout-strategy-demo}
    spec:
      containers:
        - name: web
          image: nginx:1.28
