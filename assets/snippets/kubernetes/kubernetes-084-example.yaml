apiVersion: v1
kind: Pod
metadata: {name: ssd-only-demo}
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values: [ssd]
  containers:
    - name: app
      image: nginx:1.28
