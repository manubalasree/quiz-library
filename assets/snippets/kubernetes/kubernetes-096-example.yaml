apiVersion: v1
kind: Pod
metadata:
  name: preferred-spread
  labels: {app: preferred-spread}
spec:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels: {app: preferred-spread}
  containers:
    - name: app
      image: nginx:1.28
