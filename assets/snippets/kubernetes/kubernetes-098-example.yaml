apiVersion: apps/v1
kind: Deployment
metadata: {name: layered-spread-demo}
spec:
  replicas: 3
  selector:
    matchLabels: {app: layered-spread-demo}
  template:
    metadata:
      labels: {app: layered-spread-demo}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: layered-spread-demo}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: layered-spread-demo}
      containers:
        - name: app
          image: nginx:1.28
